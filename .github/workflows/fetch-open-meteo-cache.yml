name: Prefetch Open-Meteo Notification Cache

on:
  schedule:
    # 15:30 JST, 30 minutes before the 16:00 evening LINE notification.
    - cron: "30 6 * * *"
    # 15:40 JST backup — GitHub Actions' `schedule` trigger is best-effort and
    # can occasionally skip a slot (observed 2026-07-27: the 15:30 run never
    # fired, leaving stale/expired prefetch data and an empty LINE
    # notification for affected users). A second run 10 minutes later still
    # leaves 20 minutes of buffer before the 16:00 notification and simply
    # overwrites the same Redis keys with fresher data if the primary run did
    # succeed — harmless either way.
    - cron: "40 6 * * *"
    # 01:00 JST, 30 minutes before the 01:30 morning LINE notification.
    - cron: "0 16 * * *"
    # 01:10 JST backup, same rationale as the 15:40 JST one above.
    - cron: "10 16 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "Notification cache kind to prefetch"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening

permissions:
  contents: read

concurrency:
  group: open-meteo-prefetch-${{ github.event.schedule || inputs.kind }}
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      OPEN_METEO_BASE_URL: ${{ vars.OPEN_METEO_BASE_URL }}
      OPEN_METEO_MARINE_BASE_URL: ${{ vars.OPEN_METEO_MARINE_BASE_URL }}
      OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
      # 2026-08-04: このjobのcollect_canary_targets()にカナリア地点リストを渡す
      # ためのマッピングが抜けており、実際に登録済みのLINE通知対象と重ならない限り
      # enhanced_forecast/marineのprefetchが一度も作られていなかった不具合の修正。
      # Renderの環境変数LINE_WEB_FORECAST_CANARY_SPOT_IDSと同じ値をGitHub Actions
      # のrepository variableとして設定すること（単一の真実源はRender側）。
      LINE_WEB_FORECAST_CANARY_SPOT_IDS: ${{ vars.LINE_WEB_FORECAST_CANARY_SPOT_IDS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check requests==2.31.0

      - name: Pick notification kind
        id: kind
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            kind="${{ inputs.kind }}"
          elif [ "${{ github.event.schedule }}" = "30 6 * * *" ] || [ "${{ github.event.schedule }}" = "40 6 * * *" ]; then
            kind="evening"
          else
            kind="morning"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Verify required secrets
        shell: bash
        run: |
          if [ -z "$UPSTASH_REDIS_REST_URL" ] || [ -z "$UPSTASH_REDIS_REST_TOKEN" ]; then
            echo "Required Upstash GitHub secrets are not configured." >&2
            exit 1
          fi

      - name: Prefetch raw Open-Meteo responses
        run: python jobs/fetch_open_meteo_for_notifications.py --kind "${{ steps.kind.outputs.kind }}"
