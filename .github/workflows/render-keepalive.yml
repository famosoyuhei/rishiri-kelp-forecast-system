name: Render Keep-Alive Ping

# Keeps the free-tier Render web service from sleeping during hours LINE
# users (kelp fishermen) are realistically active, without running 24/7 —
# see docs/RENDER_FREE_TIER_KEEPALIVE.md for the full rationale (2026-07-30
# Render instance-hour usage warning).
#
# Awake window: 01:00-20:00 JST daily (ping every 30 minutes).
# Deliberately asleep: 20:00-01:00 JST daily (no pings — Render free tier
# sleeps after ~15 minutes of no traffic).
#
# 01:00-20:00 JST == 16:00-11:00 UTC (spans midnight UTC), i.e. every UTC
# hour EXCEPT 11:00-15:59 UTC (== 20:00-00:59 JST).
#
# 2026-08-02 incident: this workflow originally requested */5 (up to 228
# triggers/day). That same day, two unrelated scheduled workflows in this
# repo (fetch-open-meteo-cache.yml's evening prefetch AND
# line-notifications.yml's 16:05 JST backup) both silently failed to fire at
# all, causing a missed 16:00 JST LINE notification — GitHub Actions
# explicitly documents that repos with many/frequent scheduled workflows can
# have OTHER scheduled runs delayed or dropped entirely. Reduced to */30
# (matching UptimeRobot's own interval) to relieve that pressure; the
# genuinely important workflows (LINE notifications, Open-Meteo prefetch)
# take priority over precise keep-alive timing.

on:
  schedule:
    - cron: "*/30 0-10,16-23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: https://rishiri-kelp-forecast-system.onrender.com/health
    steps:
      # 2026-08-01 incident: a bare --max-time 20 single-shot request failed
      # every run with a 20s timeout, because this app's cold start (heavy
      # pandas/numpy/scipy dependencies) routinely takes longer than that —
      # sending a "Run failed" email on every single cold start, exactly the
      # scenario this workflow exists to handle gracefully. Matches the
      # already-proven retry pattern from line-notifications.yml's
      # "Wake service" step instead of a single strict-timeout attempt.
      - name: Ping /health to keep the service awake
        run: curl --fail --show-error --silent --retry 5 --retry-delay 15 --max-time 30 "$HEALTH_URL"
