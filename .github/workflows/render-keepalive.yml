name: Render Keep-Alive Ping

# 2026-08-03: keep-alive duty moved to cron-job.org (job "render-keepalive"),
# which pings /health every 10 minutes during 01:00-20:00 JST directly —
# see docs/RENDER_FREE_TIER_KEEPALIVE.md for the full history. This
# workflow's `schedule` trigger is intentionally removed:
#
# 1. GitHub Actions' scheduler proved unreliable at any frequency we tried
#    here (*/5 caused other workflows in this repo to be delayed/dropped;
#    */30 was too infrequent to actually prevent Render's ~15-minute
#    sleep timeout, so the "keep it warm" goal silently stopped working
#    the moment that change shipped). A 2026-08-03 incident showed GitHub
#    Actions itself running ~2 hours late across multiple unrelated
#    workflows in this repo during the same window.
# 2. cron-job.org has proven far more punctual for time-sensitive triggers
#    (see the LINE notification and Open-Meteo prefetch triggers, both
#    already moved there) and isn't subject to GitHub Actions' scheduling
#    contention at all, since it's a separate service.
#
# `workflow_dispatch` is kept for manual/emergency pings only.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: https://rishiri-kelp-forecast-system.onrender.com/health
    steps:
      # 2026-08-01 incident: a bare --max-time 20 single-shot request failed
      # every run with a 20s timeout, because this app's cold start (heavy
      # pandas/numpy/scipy dependencies) routinely takes longer than that —
      # sending a "Run failed" email on every single cold start, exactly the
      # scenario this workflow exists to handle gracefully. Matches the
      # already-proven retry pattern from line-notifications.yml's
      # "Wake service" step instead of a single strict-timeout attempt.
      - name: Ping /health to keep the service awake
        run: curl --fail --show-error --silent --retry 5 --retry-delay 15 --max-time 30 "$HEALTH_URL"
