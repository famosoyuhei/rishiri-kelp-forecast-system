name: Archive Nowcast Observation

# One-off maintenance: stream the raw nowcast_observation tab out to a
# CSV.gz artifact, and (only on explicit confirm) delete the tab to free
# ~16M cells in the accuracy workbook.
on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: 'Delete the tab after a verified archive (true/false)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install "google-auth[requests]"

      - name: Archive (and optionally delete) nowcast_observation
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RISHIRI_SPREADSHEET_ID: ${{ secrets.RISHIRI_SPREADSHEET_ID }}
          CONFIRM_DELETE: ${{ inputs.confirm_delete == 'true' && '1' || '' }}
        run: python archive_nowcast_observation.py

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: nowcast_observation_csv
          path: nowcast_observation.csv.gz
          retention-days: 90
